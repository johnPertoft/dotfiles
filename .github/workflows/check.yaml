on:
  push:
  workflow_dispatch:
    inputs:
      publish_cache:
        description: Publish the ThinkCentre system closure to Cachix
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show flake
        run: nix flake show

      - name: Check flake evaluation
        run: nix flake check --keep-going

  build-thinkcentre:
    needs: check
    if: >-
      github.repository == 'johnPertoft/dotfiles' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/ci-build')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: thinkcentre-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: johnpertoft
          extraPullNames: nix-community
          skipPush: true

      - name: Require cache write token
        if: github.event_name == 'workflow_dispatch' && inputs.publish_cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Set the CACHIX_AUTH_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Build ThinkCentre system
        run: |
          nix build --out-link result-thinkcentre --print-build-logs \
            --max-jobs 2 --cores 2 \
            .#nixosConfigurations.thinkcentre.config.system.build.toplevel

      - name: Publish ThinkCentre closure
        if: github.event_name == 'workflow_dispatch' && inputs.publish_cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push johnpertoft "$(readlink -f result-thinkcentre)"
