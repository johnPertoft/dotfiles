on:
  push:
    branches: [main, fix/ci-build]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:
    inputs:
      publish_cache:
        description: Publish the ThinkCentre system closure to Cachix
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show flake
        run: nix flake show

      - name: Check flake evaluation
        run: nix flake check --keep-going

  build:
    needs: check
    if: >-
      github.repository == 'johnPertoft/dotfiles' &&
      (github.event_name == 'pull_request' ||
       github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/ci-build')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ThinkCentre system
            attr: nixosConfigurations.thinkcentre.config.system.build.toplevel
            runner: ubuntu-24.04
            publish: true
          - name: Desktop system
            attr: nixosConfigurations.home-desktop.config.system.build.toplevel
            runner: ubuntu-24.04
            publish: false
          - name: Desktop home
            attr: legacyPackages.x86_64-linux.homeConfigurations.john.activationPackage
            runner: ubuntu-24.04
            publish: false
          - name: MacBook system
            attr: darwinConfigurations.STOLTM7XVQCG7.system
            runner: macos-15
            publish: false
          - name: MacBook home
            attr: legacyPackages.aarch64-darwin.homeConfigurations."john.pertoft".activationPackage
            runner: macos-15
            publish: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    concurrency:
      group: build-${{ matrix.attr }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      BUILD_ATTR: ${{ matrix.attr }}
      # cachix use writes user-level cache lists; append these after loading them.
      NIX_CONFIG: |
        extra-substituters = https://cache.numtide.com https://cache.nixos-cuda.org
        extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: johnpertoft
          extraPullNames: nix-community,devenv
          skipPush: true

      - name: Show effective binary caches
        run: nix config show substituters

      - name: Require cache write token
        if: github.event_name == 'workflow_dispatch' && inputs.publish_cache && matrix.publish
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Set the CACHIX_AUTH_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Build configuration
        run: |
          nix build --out-link result --json --print-build-logs \
            --max-jobs 2 --cores 2 \
            ".#${BUILD_ATTR}" > "$RUNNER_TEMP/build-result.json"

      - name: Publish ThinkCentre closure
        if: github.event_name == 'workflow_dispatch' && inputs.publish_cache && matrix.publish
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: jq -r '.[].outputs[]' "$RUNNER_TEMP/build-result.json" | cachix push johnpertoft
