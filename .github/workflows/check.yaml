on:
  push:
    branches: [main, fix/ci-build]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:
    inputs:
      publish_cache:
        description: Publish selected expensive Linux builds to Cachix
        type: boolean
        default: false
      minimum_build_seconds:
        description: Minimum executed build time in positive whole seconds
        type: number
        default: 300
      build_targets:
        description: Configurations to build
        type: choice
        default: all
        options:
          - all
          - desktop
          - cache-probe

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    concurrency:
      group: check-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Choose build targets
        id: matrix
        env:
          BUILD_TARGETS: ${{ inputs.build_targets || 'all' }}
          PUBLISH_REQUESTED: ${{ inputs.publish_cache }}
          BUILD_MATRIX: |
            {"include": [
              {
                "name": "ThinkCentre system",
                "group": "thinkcentre",
                "attr": "nixosConfigurations.thinkcentre.config.system.build.toplevel",
                "runner": "ubuntu-24.04",
                "publish": true
              },
              {
                "name": "Desktop system",
                "group": "desktop",
                "attr": "nixosConfigurations.home-desktop.config.system.build.toplevel",
                "runner": "ubuntu-24.04",
                "publish": true
              },
              {
                "name": "Desktop home",
                "group": "desktop",
                "attr": "legacyPackages.x86_64-linux.homeConfigurations.john.activationPackage",
                "runner": "ubuntu-24.04",
                "publish": true
              },
              {
                "name": "MacBook system",
                "group": "macbook",
                "attr": "darwinConfigurations.STOLTM7XVQCG7.system",
                "runner": "macos-15",
                "publish": false
              },
              {
                "name": "MacBook home",
                "group": "macbook",
                "attr": "legacyPackages.aarch64-darwin.homeConfigurations.\"john.pertoft\".activationPackage",
                "runner": "macos-15",
                "publish": false
              }
            ]}
        run: |
          if [ "$BUILD_TARGETS" = "cache-probe" ] && [ "$PUBLISH_REQUESTED" != "true" ]; then
            echo "::error::The cache probe requires publish_cache=true."
            exit 1
          fi
          matrix=$(jq -c --arg targets "$BUILD_TARGETS" '
            if $targets == "all" then .
            elif $targets == "desktop" then .include |= map(select(.group == "desktop"))
            elif $targets == "cache-probe" then
              {"include": [{
                "name": "Cache smoke probe",
                "group": "cache-probe",
                "attr": "cache-probe",
                "runner": "ubuntu-24.04",
                "publish": true
              }]}
            else error("Unknown build target group")
            end
          ' <<< "$BUILD_MATRIX")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Check selective cache logic and build telemetry
        env:
          NIX_CACHE_INTEGRATION: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Show flake
        run: nix flake show

      - name: Check flake evaluation
        run: nix flake check --keep-going

  build:
    needs: check
    outputs:
      cache_probe_path: ${{ steps.probe.outputs.path }}
      cache_probe_id: ${{ steps.probe.outputs.id }}
    if: >-
      github.repository == 'johnPertoft/dotfiles' &&
      (github.event_name == 'pull_request' ||
       github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/ci-build')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    concurrency:
      group: build-${{ matrix.attr }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    env:
      BUILD_ATTR: ${{ matrix.attr }}
      BUILD_GROUP: ${{ matrix.group }}
      PUBLISH_CACHE: >-
        ${{ matrix.publish &&
            ((github.event_name == 'workflow_dispatch' && inputs.publish_cache) ||
             (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
      CACHE_MIN_SECONDS: >-
        ${{ github.event_name == 'workflow_dispatch' &&
            format('{0}', inputs.minimum_build_seconds) || '300' }}
      CACHE_CANDIDATE_MIB: "1024"
      CACHE_BUDGET_MIB: "1024"
      # cachix use writes user-level cache lists; append these after loading them.
      NIX_CONFIG: |
        extra-substituters = https://cache.numtide.com https://cache.nixos-cuda.org
        extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: johnpertoft
          extraPullNames: nix-community,devenv
          skipPush: true

      - name: Show effective binary caches
        run: nix config show substituters

      - name: Require cache write token
        if: env.PUBLISH_CACHE == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Set the CACHIX_AUTH_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Build configuration
        run: |
          if [ "$BUILD_GROUP" = "cache-probe" ]; then
            python3 .github/scripts/cache_builds.py build \
              --directory "$RUNNER_TEMP/selective-cache" -- \
              nix build --out-link result --json --print-build-logs \
              --max-jobs 2 --cores 2 --builders "" --impure \
              --file .github/cache-probe.nix \
              --argstr probeId "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --argstr minimumBuildSeconds "$CACHE_MIN_SECONDS"
          elif [ "${{ matrix.publish }}" = "true" ]; then
            python3 .github/scripts/cache_builds.py build \
              --directory "$RUNNER_TEMP/selective-cache" -- \
              nix build --out-link result --json --print-build-logs \
              --max-jobs 2 --cores 2 --builders "" ".#${BUILD_ATTR}"
          else
            nix build --out-link result --json --print-build-logs \
              --max-jobs 2 --cores 2 ".#${BUILD_ATTR}" > "$RUNNER_TEMP/build-result.json"
          fi

      - name: Select expensive builds within the upload budget
        if: matrix.publish
        run: |
          python3 .github/scripts/cache_builds.py select \
            --directory "$RUNNER_TEMP/selective-cache" --cache johnpertoft \
            --minimum-seconds "$CACHE_MIN_SECONDS" \
            --candidate-mib "$CACHE_CANDIDATE_MIB" --budget-mib "$CACHE_BUDGET_MIB"

      - name: Require the slow probe to be selected
        if: matrix.group == 'cache-probe'
        id: probe
        run: |
          probe=$(cat result)
          jq -e --arg path "$probe" '.selected_outputs == [$path]' \
            "$RUNNER_TEMP/selective-cache/selection.json"
          echo "path=$probe" >> "$GITHUB_OUTPUT"
          echo "id=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Publish selected package closures
        if: env.PUBLISH_CACHE == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          paths="$RUNNER_TEMP/selective-cache/selected-paths.txt"
          if [ -s "$paths" ]; then
            cachix push johnpertoft < "$paths"
          else
            echo "No builds meet the duration and closure-size policy; nothing to upload."
          fi

      - name: Save cache selection report
        if: always() && matrix.publish
        uses: actions/upload-artifact@v4
        with:
          name: cache-report-${{ matrix.name }}
          path: ${{ runner.temp }}/selective-cache/
          if-no-files-found: ignore
          retention-days: 7

  cache-probe-pull:
    name: Retrieve probe without building
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.build_targets == 'cache-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROBE_PATH: ${{ needs.build.outputs.cache_probe_path }}
      PROBE_ID: ${{ needs.build.outputs.cache_probe_id }}
    steps:
      - name: Install Nix on a fresh runner
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Retrieve the probe exclusively from Cachix
        run: |
          if [ -z "$PROBE_PATH" ] || [ -z "$PROBE_ID" ]; then
            echo "::error::The build job did not report the published probe."
            exit 1
          fi
          if [ -e "$PROBE_PATH" ]; then
            echo "::error::The probe is already present; this is not a fresh-store test."
            exit 1
          fi
          nix-store --realise "$PROBE_PATH" \
            --option max-jobs 0 --option builders "" \
            --option substituters https://johnpertoft.cachix.org \
            --option trusted-public-keys johnpertoft.cachix.org-1:/P3D1kQVPzjJ5K7pza23Fh/cvZf89IdkRaPKx1ZYjfY= \
            --option require-sigs true --option fallback false
          if [ "$(cat "$PROBE_PATH")" != "cache-probe-$PROBE_ID" ]; then
            echo "::error::The retrieved probe does not contain the expected marker."
            exit 1
          fi
          printf '### Cachix probe retrieved successfully\n\nFetched output:\n\n    %s\n\nLocal and remote builds were disabled, with only johnpertoft.cachix.org configured.\n' \
            "$PROBE_PATH" >> "$GITHUB_STEP_SUMMARY"
